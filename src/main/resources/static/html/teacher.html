<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师管理 - 学生教师管理系统</title>
    <!-- 外部资源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',    // 蓝色（学生管理）
                        secondary: '#10B981',  // 绿色（教师管理）
                        danger: '#EF4444',     // 红色（删除/危险）
                        warning: '#F59E0B',    // 黄色（编辑）
                        info: '#6366F1'        // 靛蓝色（班级管理）
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<!-- 导航栏容器 -->
<div id="navbarContainer"></div>

<!-- 教师管理内容 -->
<main class="flex-grow container mx-auto px-4 py-8">
    <div id="teachersSection">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden mb-8">
            <div class="bg-secondary p-4">
                <h2 class="text-white text-xl font-bold flex items-center">
                    <i class="fa fa-briefcase mr-2"></i> 教师列表
                    <button id="addTeacherBtn"
                            class="ml-auto bg-white text-secondary px-4 py-1 rounded-md text-sm font-medium hover:bg-gray-100 transition-colors">
                        <i class="fa fa-plus mr-1"></i> 添加教师
                    </button>
                </h2>
            </div>
            <div class="p-4">
                <div class="flex justify-between mb-4">
                    <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                <i class="fa fa-search"></i>
                            </span>
                        <input type="text" id="teacherSearch" placeholder="搜索教师..."
                               class="pl-10 block w-full rounded-md border-gray-300 shadow-sm focus:border-secondary focus:ring focus:ring-secondary/30 transition duration-200">
                    </div>
                    <button id="refreshTeachers"
                            class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-1 rounded-md text-sm font-medium transition-colors">
                        <i class="fa fa-refresh mr-1"></i> 刷新
                    </button>
                </div>
                <!-- 教师表格（新增班级列） -->
                <div id="teachersTable" class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                        <tr>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                教师ID
                            </th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                姓名
                            </th>
                            <!-- 新增班级列 -->
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                班级
                            </th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                年龄
                            </th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                性别
                            </th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                科目
                            </th>
                            <th scope="col"
                                class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                                操作
                            </th>
                        </tr>
                        </thead>
                        <tbody id="teachersBody" class="bg-white divide-y divide-gray-200">
                        <tr class="text-center">
                            <td colspan="7" class="px-6 py-12 text-gray-500">
                                <i class="fa fa-spinner fa-spin text-2xl mb-2"></i>
                                <p>加载中...</p>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- 添加教师模态框（新增班级输入框） -->
<div id="addTeacherModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md transform transition-all">
        <div class="bg-secondary p-4 rounded-t-lg">
            <h3 class="text-white text-lg font-bold flex items-center">
                <i class="fa fa-user-plus mr-2"></i> 添加教师
                <button id="closeTeacherModal" class="ml-auto text-white hover:text-gray-200">
                    <i class="fa fa-times"></i>
                </button>
            </h3>
        </div>
        <div class="p-6">
            <form id="addTeacherForm">
                <div class="mb-4">
                    <label for="teacherId" class="block text-sm font-medium text-gray-700 mb-1">教师ID</label>
                    <input type="text" id="teacherId"
                           class="block w-full rounded-md border-gray-300 shadow-sm focus:border-secondary focus:ring focus:ring-secondary/30 transition duration-200"
                           required>
                </div>
                <div class="mb-4">
                    <label for="teacherName" class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                    <input type="text" id="teacherName"
                           class="block w-full rounded-md border-gray-300 shadow-sm focus:border-secondary focus:ring focus:ring-secondary/30 transition duration-200"
                           required>
                </div>
                <!-- 新增班级输入框 -->
                <div class="mb-4">
                    <label for="teacherClass" class="block text-sm font-medium text-gray-700 mb-1">班级</label>
                    <input type="text" id="teacherClass"
                           class="block w-full rounded-md border-gray-300 shadow-sm focus:border-secondary focus:ring focus:ring-secondary/30 transition duration-200"
                           required>
                </div>
                <div class="mb-4">
                    <label for="teacherAge" class="block text-sm font-medium text-gray-700 mb-1">年龄</label>
                    <input type="number" id="teacherAge"
                           class="block w-full rounded-md border-gray-300 shadow-sm focus:border-secondary focus:ring focus:ring-secondary/30 transition duration-200"
                           required>
                </div>
                <div class="mb-4">
                    <label for="teacherSex" class="block text-sm font-medium text-gray-700 mb-1">性别</label>
                    <select id="teacherSex"
                            class="block w-full rounded-md border-gray-300 shadow-sm focus:border-secondary focus:ring focus:ring-secondary/30 transition duration-200"
                            required>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label for="teacherTeaching" class="block text-sm font-medium text-gray-700 mb-1">科目</label>
                    <input type="text" id="teacherTeaching"
                           class="block w-full rounded-md border-gray-300 shadow-sm focus:border-secondary focus:ring focus:ring-secondary/30 transition duration-200"
                           required>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancelAddTeacher"
                            class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition-colors">
                        取消
                    </button>
                    <button type="submit"
                            class="px-4 py-2 bg-secondary text-white rounded-md hover:bg-secondary/90 transition-colors">
                        保存
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 编辑教师模态框（新增班级输入框） -->
<div id="editTeacherModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md transform transition-all">
        <div class="bg-warning p-4 rounded-t-lg">
            <h3 class="text-white text-lg font-bold flex items-center">
                <i class="fa fa-pencil mr-2"></i> 编辑教师
                <button id="closeEditTeacherModal" class="ml-auto text-white hover:text-gray-200">
                    <i class="fa fa-times"></i>
                </button>
            </h3>
        </div>
        <div class="p-6">
            <form id="editTeacherForm">
                <div class="mb-4">
                    <label for="editTeacherId" class="block text-sm font-medium text-gray-700 mb-1">教师ID</label>
                    <input type="text" id="editTeacherId"
                           class="block w-full rounded-md border-gray-300 shadow-sm bg-gray-100" readonly required>
                </div>
                <div class="mb-4">
                    <label for="editTeacherName" class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                    <input type="text" id="editTeacherName"
                           class="block w-full rounded-md border-gray-300 shadow-sm focus:border-secondary focus:ring focus:ring-secondary/30 transition duration-200"
                           required>
                </div>
                <!-- 新增班级编辑框 -->
                <div class="mb-4">
                    <label for="editTeacherClass" class="block text-sm font-medium text-gray-700 mb-1">班级</label>
                    <input type="text" id="editTeacherClass"
                           class="block w-full rounded-md border-gray-300 shadow-sm focus:border-secondary focus:ring focus:ring-secondary/30 transition duration-200"
                           required>
                </div>
                <div class="mb-4">
                    <label for="editTeacherAge" class="block text-sm font-medium text-gray-700 mb-1">年龄</label>
                    <input type="number" id="editTeacherAge"
                           class="block w-full rounded-md border-gray-300 shadow-sm focus:border-secondary focus:ring focus:ring-secondary/30 transition duration-200"
                           required>
                </div>
                <div class="mb-4">
                    <label for="editTeacherSex" class="block text-sm font-medium text-gray-700 mb-1">性别</label>
                    <select id="editTeacherSex"
                            class="block w-full rounded-md border-gray-300 shadow-sm focus:border-secondary focus:ring focus:ring-secondary/30 transition duration-200"
                            required>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label for="editTeacherTeaching" class="block text-sm font-medium text-gray-700 mb-1">科目</label>
                    <input type="text" id="editTeacherTeaching"
                           class="block w-full rounded-md border-gray-300 shadow-sm focus:border-secondary focus:ring focus:ring-secondary/30 transition duration-200"
                           required>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancelEditTeacher"
                            class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition-colors">
                        取消
                    </button>
                    <button type="submit"
                            class="px-4 py-2 bg-secondary text-white rounded-md hover:bg-secondary/90 transition-colors">
                        保存
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 确认删除模态框 -->
<div id="confirmDeleteModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md transform transition-all">
        <div class="bg-danger p-4 rounded-t-lg">
            <h3 class="text-white text-lg font-bold flex items-center">
                <i class="fa fa-trash mr-2"></i> 确认删除
            </h3>
        </div>
        <div class="p-6">
            <p id="deleteMessage" class="text-gray-700 mb-6">你确定要删除此记录吗？此操作不可撤销。</p>
            <div class="flex justify-end space-x-4">
                <button type="button" id="cancelDelete"
                        class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition-colors">取消
                </button>
                <button type="button" id="confirmDelete"
                        class="px-4 py-2 bg-danger text-white rounded-md hover:bg-danger/90 transition-colors">确认删除
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 页脚容器 -->
<div id="footerContainer"></div>

<!-- 引入JS -->
<script src="../js/index.js"></script>
<script src="../js/teacher.js"></script>
</body>
</html>
