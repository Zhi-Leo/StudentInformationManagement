<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生教师管理系统</title>
    <!-- 外部资源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        danger: '#EF4444',
                        warning: '#F59E0B',
                        info: '#6366F1',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .card-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
<!-- 导航栏 -->
<template id="navbar-template">
<nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a href="#" class="flex-shrink-0 flex items-center">
                    <i class="fa fa-graduation-cap text-primary text-2xl mr-2"></i>
                    <span class="font-bold text-xl">学生教师管理系统</span>
                </a>
            </div>
            <div class="flex items-center space-x-4">
                <button id="classesTab" class="px-4 py-2 text-gray-500 font-medium hover:text-gray-700">
                    <i class="fa fa-building mr-1"></i> 班级管理
                </button>
                <button id="studentsTab" class="px-4 py-2 text-primary font-medium border-b-2 border-primary">
                    <i class="fa fa-users mr-1"></i> 学生管理
                </button>
                <button id="teachersTab" class="px-4 py-2 text-gray-500 font-medium hover:text-gray-700">
                    <i class="fa fa-briefcase mr-1"></i> 教师管理
                </button>
                <button id="logoutBtn" class="px-4 py-2 text-danger font-medium hover:text-danger/90">
                    <i class="fa fa-sign-out mr-1"></i> 退出登录
                </button>
            </div>
        </div>
    </div>
</nav>
</template>

<!-- 主内容区（由各模块填充） -->
<main class="flex-grow container mx-auto px-4 py-8">
    <!-- 模块内容将在这里显示 -->
</main>

<!-- 页脚 -->
<template id="footer-template">
<footer class="bg-gray-800 text-white py-6">
    <div class="container mx-auto px-4">
        <div class="text-center">
            <p>© 2025 学生教师管理系统 | 版权所有</p>
        </div>
    </div>
</footer>
</template>

<!-- 共用模态框：确认删除 -->
<div id="confirmDeleteModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md transform transition-all">
        <div class="bg-danger p-4 rounded-t-lg">
            <h3 class="text-white text-lg font-bold flex items-center">
                <i class="fa fa-trash mr-2"></i> 确认删除
            </h3>
        </div>
        <div class="p-6">
            <p id="deleteMessage" class="text-gray-700 mb-6">你确定要删除此记录吗？此操作不可撤销。</p>
            <div class="flex justify-end space-x-4">
                <button type="button" id="cancelDelete" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition-colors">取消</button>
                <button type="button" id="confirmDelete" class="px-4 py-2 bg-danger text-white rounded-md hover:bg-danger/90 transition-colors">确认删除</button>
            </div>
        </div>
    </div>
</div>

<!-- 共用通知提示 -->
<div id="notification" class="fixed top-4 right-4 max-w-xs bg-white rounded-lg shadow-lg overflow-hidden transform translate-x-full transition-transform duration-500 z-50" style="right: -100%;">
    <div id="notificationHeader" class="p-3 bg-primary text-white flex justify-between items-center">
        <h3 id="notificationTitle" class="font-medium">通知</h3>
        <button id="closeNotification" class="text-white hover:text-gray-200 transition-colors">
            <i class="fa fa-times"></i>
        </button>
    </div>
    <div class="p-4">
        <p id="notificationMessage"></p>
    </div>
</div>

<!-- 引入共用JS -->
<script src="../js/index.js"></script>
</body>
</html>
