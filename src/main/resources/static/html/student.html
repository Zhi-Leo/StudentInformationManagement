<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理 - 学生教师管理系统</title>
    <!-- 外部资源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',    // 蓝色（学生管理）
                        secondary: '#10B981',  // 绿色（教师管理）
                        danger: '#EF4444',     // 红色（删除/危险）
                        warning: '#F59E0B',    // 黄色（编辑）
                        info: '#6366F1'        // 靛蓝色（班级管理）
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities { .content-auto { content-visibility: auto; } }
    </style>
</head>
<!-- student.html 的 body 部分 -->
<body class="bg-gray-50 min-h-screen flex flex-col">
<!-- 新增导航栏容器 -->
<div id="navbarContainer"></div>

<!--&lt;!&ndash; 原来的学生管理内容... &ndash;&gt;-->
<!--<main class="flex-grow container mx-auto px-4 py-8">...</main>-->
<!-- 导航栏（复用html.html的结构） -->
<nav class="bg-white shadow-md">
    <!-- 内容同html.html的导航栏 -->

</nav>

<!-- 学生管理内容 -->
<main class="flex-grow container mx-auto px-4 py-8">
    <div id="studentsSection">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden mb-8">
            <div class="bg-primary p-4">
                <h2 class="text-white text-xl font-bold flex items-center">
                    <i class="fa fa-users mr-2"></i> 学生列表
                    <button id="addStudentBtn" class="ml-auto bg-white text-primary px-4 py-1 rounded-md text-sm font-medium hover:bg-gray-100 transition-colors">
                        <i class="fa fa-plus mr-1"></i> 添加学生
                    </button>
                </h2>
            </div>
            <div class="p-4">
                <div class="flex justify-between mb-4">
                    <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                                <i class="fa fa-search"></i>
                            </span>
                        <input type="text" id="studentSearch" placeholder="搜索学生..." class="pl-10 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary/30 transition duration-200">
                    </div>
                    <button id="refreshStudents" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-1 rounded-md text-sm font-medium transition-colors">
                        <i class="fa fa-refresh mr-1"></i> 刷新
                    </button>
                </div>
                <div id="studentsTable" class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">学号</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">姓名</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">年龄</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">性别</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">成绩</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                        </thead>
                        <tbody id="studentsBody" class="bg-white divide-y divide-gray-200">
                        <tr class="text-center">
                            <td colspan="6" class="px-6 py-12 text-gray-500">
                                <i class="fa fa-spinner fa-spin text-2xl mb-2"></i>
                                <p>加载中...</p>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- 学生管理模态框 -->
<!-- 添加学生模态框 -->
<div id="addStudentModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md transform transition-all">
        <div class="bg-primary p-4 rounded-t-lg">
            <h3 class="text-white text-lg font-bold flex items-center">
                <i class="fa fa-user-plus mr-2"></i> 添加学生
                <button id="closeStudentModal" class="ml-auto text-white hover:text-gray-200">
                    <i class="fa fa-times"></i>
                </button>
            </h3>
        </div>
        <div class="p-6">
            <form id="addStudentForm">
                <!-- 表单内容同原代码 -->
                <div class="mb-4">
                    <label for="studentId" class="block text-sm font-medium text-gray-700 mb-1">学号</label>
                    <input type="text" id="studentId" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary/30 transition duration-200" required>
                </div>
                <div class="mb-4">
                    <label for="studentName" class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                    <input type="text" id="studentName" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary/30 transition duration-200" required>
                </div>
                <div class="mb-4">
                    <label for="studentAge" class="block text-sm font-medium text-gray-700 mb-1">年龄</label>
                    <input type="number" id="studentAge" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary/30 transition duration-200" required>
                </div>
                <div class="mb-4">
                    <label for="studentSex" class="block text-sm font-medium text-gray-700 mb-1">性别</label>
                    <select id="studentSex" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary/30 transition duration-200" required>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label for="studentGrade" class="block text-sm font-medium text-gray-700 mb-1">成绩</label>
                    <input type="number" step="0.01" id="studentGrade" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary/30 transition duration-200" required>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancelAddStudent" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition-colors">取消</button>
                    <button type="submit" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition-colors">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 学生编辑模态框（示例） -->
<div id="editStudentModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md transform transition-all">
        <div class="bg-primary p-4 rounded-t-lg">
            <h3 class="text-white text-lg font-bold">编辑学生</h3>
        </div>
        <div class="p-6">
            <form id="editStudentForm">
                <!-- 编辑表单字段与添加表单一致，仅ID设为只读 -->
                <div class="mb-4">
                    <label for="editStudentId" class="block text-sm font-medium text-gray-700 mb-1">学生ID</label>
                    <input type="text" id="editStudentId" class="block w-full rounded-md border-gray-300 shadow-sm bg-gray-100" readonly required>
                </div>
                <div class="mb-4">
                    <label for="editStudentName" class="block text-sm font-medium text-gray-700">姓名</label>
                    <input type="text" id="editStudentName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary/20 focus:ring-opacity-50">
                </div>
                <div class="mb-4">
                    <label for="editStudentAge" class="block text-sm font-medium text-gray-700">年龄</label>
                    <input type="number" id="editStudentAge" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary/20 focus:ring-opacity-50">
                </div>
                <div class="mb-4">
                    <label for="editStudentSex" class="block text-sm font-medium text-gray-700">性别</label>
                    <select id="editStudentSex" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary/20 focus:ring-opacity-50">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="editStudentGrade" class="block text-sm font-medium text-gray-700">成绩</label>
                    <input type="number" step="0.01" id="editStudentGrade" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary/20 focus:ring-opacity-50">
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancelEditStudent" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition-colors">取消</button>
                    <button type="submit" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition-colors">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 页脚（复用） -->
<footer class="bg-gray-800 text-white py-6">
    <!-- 同html.html的页脚 -->
</footer>

<!-- 引入JS -->
<script src="../js/index.js"></script>
<script src="../js/student.js"></script>
</body>
</html>
