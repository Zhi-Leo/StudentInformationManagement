# ========== 全局通用配置 - 所有环境都生效 ==========
spring:
  # 热部署开关
  devtools:
    restart:
      enabled: false
  # JPA/Hibernate 全局配置
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # ========== 关键配置：激活指定环境 ==========
  profiles:
#    active: prod # 激活生产环境 → 加载 application-prod.yml
   active: dev  # 激活开发环境 → 加载 application-dev.yml


# 日志级别配置
logging:
  level:
    org.hibernate: DEBUG
    org.springframework: DEBUG